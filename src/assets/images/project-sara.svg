<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="50%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>
    <radialGradient id="amberSpot" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#dfb76c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#dfb76c" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd" />
      <stop offset="25%" stop-color="#eac67a" />
      <stop offset="55%" stop-color="#c99c43" />
      <stop offset="85%" stop-color="#f7dfa5" />
      <stop offset="100%" stop-color="#9a7122" />
    </linearGradient>

    <linearGradient id="goldSubtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99c43" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#fdf3cd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9a7122" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b" />
      <stop offset="50%" stop-color="#14171e" />
      <stop offset="100%" stop-color="#0d0f13" />
    </linearGradient>

    <linearGradient id="slateStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2e3a" />
      <stop offset="100%" stop-color="#1b1e25" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1200" fill="url(#bgGlow)" />
  <rect width="1200" height="1200" fill="url(#amberSpot)" />

  <!-- Viewfinder Grid & Cinematic Guides -->
  <g opacity="0.18" stroke="#dfb76c" stroke-width="1">
    <!-- Frame border -->
    <rect x="80" y="80" width="1040" height="1040" fill="none" stroke-dasharray="8 12" />
    <!-- Center crosshairs -->
    <line x1="600" y1="80" x2="600" y2="110" />
    <line x1="600" y1="1090" x2="600" y2="1120" />
    <line x1="80" y1="600" x2="110" y2="600" />
    <line x1="1090" y1="600" x2="1120" y2="600" />
    <!-- Viewfinder corners -->
    <path d="M 120 160 L 120 120 L 160 120" fill="none" stroke-width="2" />
    <path d="M 1040 120 L 1080 120 L 1080 160" fill="none" stroke-width="2" />
    <path d="M 120 1040 L 120 1080 L 160 1080" fill="none" stroke-width="2" />
    <path d="M 1040 1080 L 1080 1080 L 1080 1040" fill="none" stroke-width="2" />
  </g>

  <!-- Technical Overlay Meta -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#a08246" opacity="0.65">
    <text x="120" y="110">4K · 24FPS · RAW LOG</text>
    <text x="960" y="110">ISO 800 · 35MM</text>
    <text x="120" y="1105">SCENE 04 · TAKE 01</text>
    <text x="945" y="1105">TC: 01:24:18:09</text>
  </g>

  <!-- Secondary Stacked Business Card / Pass behind -->
  <g transform="translate(680, 680) rotate(8)" filter="url(#cardShadow)">
    <rect x="-180" y="-120" width="360" height="230" rx="14" fill="#111318" stroke="#333842" stroke-width="1.5" />
    <rect x="-160" y="-100" width="320" height="190" rx="8" fill="none" stroke="#252a33" stroke-width="1" />
    <!-- Mini Gold Monogram -->
    <circle cx="-100" cy="-5" r="28" fill="none" stroke="url(#goldPrimary)" stroke-width="2.5" />
    <path d="M -107 -15 C -96 -18, -92 -7, -100 -5 C -108 -3, -104 9, -93 7" fill="none" stroke="url(#goldPrimary)" stroke-width="2.5" stroke-linecap="round" />
    <text x="-50" y="-12" font-family="'Cinzel', 'Playfair Display', serif" font-size="15" font-weight="700" letter-spacing="3" fill="url(#goldPrimary)">SARA</text>
    <text x="-50" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#8d94a2">PRODUCTIONS</text>
    <text x="-50" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" letter-spacing="1.5" fill="#c99c43">ALL ACCESS · CREW</text>
  </g>

  <!-- Main Hero Slate / Brand Identity Board -->
  <g transform="translate(600, 560)" filter="url(#cardShadow)">
    <!-- Board Base -->
    <rect x="-380" y="-360" width="760" height="680" rx="20" fill="url(#cardGrad)" stroke="#2b303c" stroke-width="2" />

    <!-- Subtle inner rim gold border -->
    <rect x="-365" y="-345" width="730" height="650" rx="14" fill="none" stroke="url(#goldSubtle)" stroke-width="1" />

    <!-- Clapperboard Header Stripes -->
    <g transform="translate(-365, -345)">
      <clipPath id="clapperClip">
        <rect x="0" y="0" width="730" height="90" rx="13" />
      </clipPath>
      <g clip-path="url(#clapperClip)">
        <rect x="0" y="0" width="730" height="90" fill="#121419" />
        <!-- Diagonal Chevron Stripes -->
        <polygon points="0,0 45,0 0,90" fill="url(#goldPrimary)" opacity="0.85" />
        <polygon points="75,0 165,0 80,90 -5,90" fill="url(#goldPrimary)" opacity="0.85" />
        <polygon points="195,0 285,0 200,90 115,90" fill="url(#goldPrimary)" opacity="0.85" />
        <polygon points="315,0 405,0 320,90 235,90" fill="url(#goldPrimary)" opacity="0.85" />
        <polygon points="435,0 525,0 440,90 355,90" fill="url(#goldPrimary)" opacity="0.85" />
        <polygon points="555,0 645,0 560,90 475,90" fill="url(#goldPrimary)" opacity="0.85" />
        <polygon points="675,0 730,0 730,30 680,90 595,90" fill="url(#goldPrimary)" opacity="0.85" />
        <line x1="0" y1="89" x2="730" y2="89" stroke="#3b3322" stroke-width="2" />
      </g>
    </g>

    <!-- Centerpiece Brand Emblem: Cinematic Aperture & Monogram -->
    <g transform="translate(0, -60)" filter="url(#goldGlow)">
      <!-- Outer Aperture Lens Rings -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="url(#goldPrimary)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6" />
      <circle cx="0" cy="0" r="95" fill="#0d0f13" stroke="url(#goldPrimary)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="88" fill="none" stroke="#2a2315" stroke-width="1" />

      <!-- Iris / Aperture Blades (6 Blades) -->
      <g stroke="url(#goldPrimary)" stroke-width="2" fill="none" opacity="0.85">
        <line x1="0" y1="-88" x2="60" y2="-10" />
        <line x1="76" y1="-44" x2="60" y2="55" />
        <line x1="76" y1="44" x2="-10" y2="75" />
        <line x1="0" y1="88" x2="-60" y2="10" />
        <line x1="-76" y1="44" x2="-60" y2="-55" />
        <line x1="-76" y1="-44" x2="10" y2="-75" />
      </g>

      <!-- Center Stylized 'S' Icon -->
      <path d="M -24 -36 C 10 -44, 28 -24, 12 -2 C -4 18, -26 22, -10 44 C 4 58, 26 48, 28 36" 
            fill="none" stroke="url(#goldPrimary)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Center focal point -->
      <circle cx="0" cy="0" r="4" fill="url(#goldPrimary)" />
    </g>

    <!-- Typography Suite -->
    <!-- Brand Title -->
    <text x="0" y="115" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="44" font-weight="700" letter-spacing="10" text-anchor="middle" 
          fill="url(#goldPrimary)">
      SARA
    </text>
    <text x="0" y="152" 
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
          font-size="14" font-weight="600" letter-spacing="8" text-anchor="middle" 
          fill="#c0c6d4">
      PRODUCTIONS
    </text>

    <!-- Divider with Diamond -->
    <g transform="translate(0, 182)">
      <line x1="-160" y1="0" x2="-20" y2="0" stroke="url(#goldSubtle)" stroke-width="1.5" />
      <polygon points="0,-4 4,0 0,4 -4,0" fill="url(#goldPrimary)" />
      <line x1="20" y1="0" x2="160" y2="0" stroke="url(#goldSubtle)" stroke-width="1.5" />
    </g>

    <!-- Subtitle / Discipline -->
    <text x="0" y="218" 
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
          font-size="11" font-weight="600" letter-spacing="5" text-anchor="middle" 
          fill="#c99c43">
      CINEMATOGRAPHY &amp; VISUAL IDENTITY
    </text>

    <!-- Bottom Metadata Panel -->
    <g transform="translate(-320, 245)">
      <rect x="0" y="0" width="640" height="50" rx="8" fill="#0b0c10" stroke="#1d212a" stroke-width="1" />
      <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#8f96a3">DIRECTOR: SARA</text>
      <text x="235" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#8f96a3">DATE: 2024</text>
      <text x="390" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#dfb76c">STUDIO BRAND BOOK</text>
    </g>
  </g>
</svg>
